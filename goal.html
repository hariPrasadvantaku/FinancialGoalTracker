<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Goal Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.2/xlsx.full.min.js"></script>
   <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-auth.js"></script> <!-- Add this line -->
<script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-firestore.js"></script>
<script src="script.js" type="module"></script>
<script src="logout.js" type="module"></script>
    
    <style>
        /* Custom Styling */
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: "Mullish", sans-serif;
        }
        .navbar {
            background-color: #da8fdfca;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .tracker-balance {
            color: #0b0081;
            background-color: #c281c4;
            padding: 12px;
            font-weight: bold;
        }
        .under-head-text {
            background-color: #f4ff61;
            width: 50px;
            height: 5px;
            margin: 10px auto;
        }
        .table th {
            background-color: #dde8ff;
            color: #0b0081;
        }
        .table td {
            color: #0b0081;
        }
        .btn-add, .btn-save, .btn-export {
            background-color: #18ad1d;
            color: white;
        }
        .btn-edit {
            background-color: #0375ff;
            color: white;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
        .form-select, .form-control {
            color: #0b0081;
            border: 1px solid #0b0081;
        }
        .form-select:focus, .form-control:focus {
            box-shadow: 0 0 5px rgba(11, 0, 129, 0.5);
            border-color: #0b0081;
        }
        footer {
            background-color: #151515;
            padding: 20px;
            text-align: center;
            color: white;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><b>Financial Goal Tracker</b></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="goal.html">Goal</a></li>
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="mailto:vantakuhariprasad@gmail.com">Contact</a></li>
            </ul>
            <div class="buttons ms-3">
                <button id="logout-button" class="btn btn-danger" type="button">Log out</button>
            </div>    
        </div>
    </div>
</nav>

<!-- Main Content -->
<section class="container my-5">
    <div class="text-center">
        <h1 class="h3">Access Your Financial Goal Tracker</h1>
        <div class="under-head-text"></div>
    </div>

    <!-- Tracker Balance -->
    <div class="tracker-part bg-dark p-3 rounded mb-3">
        <div class="tracker-balance text-center rounded mb-4">
            <span id="balance" class="current-balance">Balance: ₹0.00</span>
        </div>

        <!-- Currency and Date Filter -->
        <div class="row my-3">
            <div class="col-md-6">
                <label for="currency" class="form-label">Select Currency:</label>
                <select class="form-select" id="currency" onchange="updateBalance()">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="INR" selected>INR</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="date" class="form-label">Choose Date:</label>
                <input type="date" class="form-control" id="date" placeholder="Date">
            </div>
        </div>

        <!-- Transaction Form -->
        <div class="transaction-form row g-2 mb-3">
            <div class="col-md">
                <input type="text" class="form-control" id="description" placeholder="Description">
            </div>
            <div class="col-md">
                <input type="number" class="form-control" id="amount" placeholder="Amount">
            </div>
            <div class="col-md">
                <select class="form-select" id="type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="col-md-auto">
                <button id="add-transaction-btn" class="btn btn-add">Add Transaction</button>
                <button id="save-transaction-btn" class="btn btn-save" style="display: none;">Save</button>
                <!-- <button id="export-btn" class="btn btn-export">Export</button> -->
                <button id="export-csv-btn" class="btn btn-export">Export to CSV</button>

            </div>
        </div>

        <!-- Transaction Table -->
        <div class="table-responsive">
            <table id="transaction-table" class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Transactions will be dynamically added here -->
                </tbody>
            </table>
            
        </div>
    </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<footer class="mt-5">
    <p>Author: Hari Prasad<br>
        &copy; copyright reserved 2024<br>
        <a href="mailto:vantakuhariprasad@gmail.com">Contact Us</a>
    </p>
</footer>
</body>

</html>
