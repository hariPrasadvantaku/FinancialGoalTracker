<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Goal Tracker - Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.0.0/firebase-firestore.js"></script>
</head>

<body>
    <header>
        <div class="main d-flex align-items-center justify-content-center">
            <div class="content text-white">
                <h1>Welcome Back!<br><span>Log in to your account</span></h1>
                <p class="par">
                    <b>Continue your financial journey!</b><br>
                    Log in to access your account and take control of your financial goals.
                </p>
            </div>
            <div class="form-details">
                <form id="login-form" class="bg-dark text-light rounded p-4 shadow">
                    <div class="user text-center mb-3">
                        <a href="index.html"><button type="button" class="btn btn-outline-light">Login</button></a>
                        <a href="signup.html"><button type="button" class="btn btn-outline-light">Signup</button></a>
                    </div>
                    <input type="email" class="form-control mb-3" name="email" placeholder="Enter Email" required>
                    <input type="password" class="form-control mb-3" name="password" placeholder="Enter Password" required>
                    <button type="submit" name="Login" class="btn btn-warning btn-block">Login</button>
                    <p class="text-center mt-3">Don't have an account? <a href="signup.html" class="text-warning">Signup here</a></p>
                    <p class="text-center mt-3">Forgot password? <a href="re_set.html" class="text-warning">Click here</a></p>
                </form>
            </div>
        </div>
    </header>
    <hr>
    <footer class="text-center bg-light py-3">
        <p>Author: Hari Prasad<br>
        &copy; Copyright reserved 2024<br>
        <a href="mailto:vantakuhariprasad@gmail.com">Contact Us</a></p>
    </footer>
    <script type="module" src="login.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
